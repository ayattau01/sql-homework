name: Check SQL

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Студент шешімін орындау
        run: psql -v ON_ERROR_STOP=1 -f solution/homework.sql

      - name: Тесті іске қосу
        run: psql -v ON_ERROR_STOP=1 -f tests/check_ddl.sql
